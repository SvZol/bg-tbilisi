# Ограничение частоты запросов (защита от перебора паролей/кодов)
limit_req_zone $binary_remote_addr zone=auth_zone:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=api_zone:10m rate=20r/s;
server_tokens off;

# HTTP → редирект на HTTPS
server {
    listen 80;
    server_name tbi-ssector.run www.tbi-ssector.run;
    return 301 https://$host$request_uri;
}

# HTTPS
server {
    listen 443 ssl;
    server_name tbi-ssector.run www.tbi-ssector.run;

    ssl_certificate     /etc/letsencrypt/live/tbi-ssector.run/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tbi-ssector.run/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers off;

    client_max_body_size 20M;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Чувствительные эндпоинты: логин, регистрация, сброс пароля, коды приглашений
    location ~ ^/api/(auth/(login|register|forgot-password|reset-password|resend-verification|verify-email)|teams/(claim|by-invite)) {
        limit_req zone=auth_zone burst=10 nodelay;
        proxy_pass http://backend:8000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API
    location /api/ {
        limit_req zone=api_zone burst=40 nodelay;
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Загружаемые файлы
    location /uploads/ {
        proxy_pass http://backend:8000/uploads/;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Frontend
    location / {
        proxy_pass http://frontend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
